name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://doby-llm.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/web-dani/' }}
      PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      PUBLIC_PROVISIONAL: ${{ vars.PUBLIC_PROVISIONAL || 'true' }}
      PUBLIC_SHOW_EDITORIAL: ${{ vars.PUBLIC_SHOW_EDITORIAL || 'true' }}
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:copy
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://doby-llm.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/web-dani/' }}
      PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      PUBLIC_PROVISIONAL: ${{ vars.PUBLIC_PROVISIONAL || 'true' }}
      PUBLIC_SHOW_EDITORIAL: ${{ vars.PUBLIC_SHOW_EDITORIAL || 'true' }}
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:budgets
      - run: npm run test:copy
      # Informational (Manu, 2026-11-18): Lighthouse timing is unstable on shared runners; it reports but does not block deploy.
      # e2e, a11y, budgets and copy checks above stay blocking. Restore blocking after the performance task.
      - run: npm run lhci
        continue-on-error: true

  deploy:
    # Only main publishes: a workflow_dispatch from a feature branch builds but never replaces the live site.
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
