# Copy overrides — planner proposal (DEC-06, pending Manu's answer to Q1).
# Rule: copydeck/ is the verbatim source. This file lists the ONLY sentences that change.
# Reason for every change: the old prototype exposes internal/dev notes to clients
# ("prioridad de captación", "placeholder honesto", "preventDefault activo"...).
# No new facts are added. Facts, prices, credentials and medical limits stay verbatim.
#
# Format: page -> list of {find: <exact old string>, replace: <new string | "" to drop>, why}
# Notes ("disclaimers") are NOT rewritten here: they get a `kind` (see notes_kind) and
# visibility is controlled by PUBLIC_PROVISIONAL (SPEC §4.2).

